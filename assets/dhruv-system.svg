<svg width="360" height="300" viewBox="8 0 344 310"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .title {
      fill: #58A6FF;
      font-family: monospace;
      font-size: 20px;
      font-weight: 700;
    }

    .label {
      fill: #c9d1d9;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
    }

    .sub {
      fill: #8b949e;
      font-family: monospace;
      font-size: 11px;
    }

    .box {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 2;
    }

    .core {
      fill: #0d1117;
      stroke: #58A6FF;
      stroke-width: 3;
    }

    .line {
      stroke: #58A6FF;
      stroke-width: 3;
      stroke-dasharray: 7 7;
      animation: flow 1.4s linear infinite;
    }

    .pulse {
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -28;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .4;
      }
      50% {
        opacity: 1;
      }
    }
  </style>


  <!-- HEADER -->

  <text x="180" y="22"
        text-anchor="middle"
        class="title">
    dhruv.engineering
  </text>

  <text x="180" y="39"
        text-anchor="middle"
        class="sub">
    SYSTEM ARCHITECTURE
  </text>


  <!-- AI / LLM SYSTEMS -->

  <rect x="22"
        y="54"
        width="316"
        height="58"
        rx="11"
        class="box"/>

  <text x="180"
        y="79"
        text-anchor="middle"
        class="label">
    AI / LLM SYSTEMS
  </text>

  <text x="180"
        y="99"
        text-anchor="middle"
        class="sub">
    RAG • Agents • ML • Inference
  </text>


  <!-- CONNECTION -->

  <line x1="180"
        y1="112"
        x2="180"
        y2="139"
        class="line"/>

  <circle cx="180"
          cy="126"
          r="6"
          fill="#58A6FF"
          class="pulse"/>


  <!-- BACKEND SYSTEMS -->

  <rect x="8"
        y="139"
        width="344"
        height="66"
        rx="12"
        class="core"/>

  <text x="180"
        y="166"
        text-anchor="middle"
        class="label">
    BACKEND SYSTEMS
  </text>

  <text x="180"
        y="188"
        text-anchor="middle"
        class="sub">
    APIs • Microservices • Events
  </text>


  <!-- CONNECTION -->

  <line x1="180"
        y1="205"
        x2="180"
        y2="231"
        class="line"/>

  <circle cx="180"
          cy="218"
          r="6"
          fill="#58A6FF"
          class="pulse"/>


  <!-- DISTRIBUTED INFRA -->

  <rect x="22"
        y="231"
        width="316"
        height="54"
        rx="11"
        class="box"/>

  <text x="180"
        y="254"
        text-anchor="middle"
        class="label">
    DISTRIBUTED INFRA
  </text>

  <text x="180"
        y="274"
        text-anchor="middle"
        class="sub">
    AWS • K8s • Kafka • Terraform
  </text>


  <!-- STATUS -->

  <circle cx="91"
          cy="295"
          r="4"
          fill="#3fb950"
          class="pulse"/>

  <text x="103"
        y="299"
        class="sub">
    SYSTEM STATUS: OPERATIONAL
  </text>

</svg>
