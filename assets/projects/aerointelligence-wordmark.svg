<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="AeroIntelligence Predictive Maintenance">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="55%" stop-color="#39d0d8" />
      <stop offset="100%" stop-color="#7ee787" />
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#39d0d8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#39d0d8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .label { fill: #3fb950; font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
    .name { fill: url(#wordmark); font: 800 48px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -2px; }
    .subtitle { fill: #8b949e; font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
    .status { fill: #7ee787; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
    .rotor { transform-origin: 73px 84px; animation: rotate 10s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .scan { animation: scan 3.2s ease-in-out infinite; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes scan { 0%, 100% { transform: translateX(0); opacity: .25; } 50% { transform: translateX(500px); opacity: .9; } }
  </style>

  <rect x="1" y="1" width="998" height="168" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <g filter="url(#glow)">
    <circle cx="73" cy="84" r="39" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.55" />
    <circle cx="73" cy="84" r="29" fill="none" stroke="#39d0d8" stroke-width="2" stroke-dasharray="5 6" class="pulse" />
    <g class="rotor" fill="#58a6ff">
      <path d="M73 79 C88 55 101 61 93 75 C87 85 80 88 73 88 Z" />
      <path d="M69 86 C44 94 42 79 58 77 C69 76 75 79 77 85 Z" />
      <path d="M77 88 C87 112 73 118 67 103 C63 93 66 86 72 82 Z" />
    </g>
    <circle cx="73" cy="84" r="7" fill="#7ee787" class="pulse" />
  </g>

  <text x="133" y="41" class="label">01 / FEATURED SYSTEM</text>
  <text x="133" y="96" class="name">AEROINTELLIGENCE</text>
  <rect x="133" y="113" width="720" height="2" rx="1" fill="url(#rule)" />
  <rect x="133" y="112" width="90" height="4" rx="2" fill="#58a6ff" class="scan" />
  <text x="133" y="142" class="subtitle">AEROSPACE PREDICTIVE MAINTENANCE · DIGITAL TWIN · REAL-TIME TELEMETRY</text>

  <circle cx="916" cy="33" r="5" fill="#3fb950" class="pulse" />
  <text x="930" y="38" class="status">ONLINE</text>
</svg>
